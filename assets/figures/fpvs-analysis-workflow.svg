<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="690" viewBox="0 0 1440 690" role="img" aria-labelledby="title description">
  <title id="title">FPVS EEG analysis workflow</title>
  <desc id="description">A twelve-step workflow moving across three rows from importing raw EEG data to preparing output for statistical analysis.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#02070d" flood-opacity="0.34"/>
    </filter>
    <filter id="arrow-shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#02070d" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1440" height="690" rx="18" fill="#07111f"/>

  <g fill="#6eb7ff" stroke="#2f6f9f" stroke-width="1.5" stroke-linejoin="round" filter="url(#arrow-shadow)">
    <path d="M 338 88 H 365 V 78 L 382 100 L 365 122 V 112 H 338 Z"/>
    <path d="M 698 88 H 725 V 78 L 742 100 L 725 122 V 112 H 698 Z"/>
    <path d="M 1058 88 H 1085 V 78 L 1102 100 L 1085 122 V 112 H 1058 Z"/>
    <path d="M 1248 168 H 1272 V 195 H 1282 L 1260 217 L 1238 195 H 1248 Z"/>
    <path d="M 1102 313 H 1075 V 303 L 1058 325 L 1075 347 V 337 H 1102 Z"/>
    <path d="M 742 313 H 715 V 303 L 698 325 L 715 347 V 337 H 742 Z"/>
    <path d="M 382 313 H 355 V 303 L 338 325 L 355 347 V 337 H 382 Z"/>
    <path d="M 168 393 H 192 V 420 H 202 L 180 442 L 158 420 H 168 Z"/>
    <path d="M 338 538 H 365 V 528 L 382 550 L 365 572 V 562 H 338 Z"/>
    <path d="M 698 538 H 725 V 528 L 742 550 L 725 572 V 562 H 698 Z"/>
    <path d="M 1058 538 H 1085 V 528 L 1102 550 L 1085 572 V 562 H 1058 Z"/>
  </g>

  <g fill="#0e2034" stroke="#506c86" stroke-width="2" filter="url(#shadow)">
    <rect x="30" y="40" width="300" height="120" rx="16"/>
    <rect x="390" y="40" width="300" height="120" rx="16"/>
    <rect x="750" y="40" width="300" height="120" rx="16"/>
    <rect x="1110" y="40" width="300" height="120" rx="16"/>
    <rect x="1110" y="265" width="300" height="120" rx="16"/>
    <rect x="750" y="265" width="300" height="120" rx="16"/>
    <rect x="390" y="265" width="300" height="120" rx="16"/>
    <rect x="30" y="265" width="300" height="120" rx="16"/>
    <rect x="30" y="490" width="300" height="120" rx="16"/>
    <rect x="390" y="490" width="300" height="120" rx="16"/>
    <rect x="750" y="490" width="300" height="120" rx="16"/>
    <rect x="1110" y="490" width="300" height="120" rx="16" stroke="#ffd166"/>
  </g>

  <g fill="#f5f7fa" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="middle">
    <text x="180" y="108">Import raw data</text>
    <text x="540" y="91"><tspan x="540">Apply electrode</tspan><tspan x="540" dy="34">montage</tspan></text>
    <text x="900" y="91"><tspan x="900">Downsample data</tspan><tspan x="900" dy="34">to 256 Hz</tspan></text>
    <text x="1260" y="91"><tspan x="1260">Apply high-pass and</tspan><tspan x="1260" dy="34">low-pass filters</tspan></text>

    <text x="1260" y="316"><tspan x="1260">Identify bad</tspan><tspan x="1260" dy="34">channels</tspan></text>
    <text x="900" y="316"><tspan x="900">Interpolate bad</tspan><tspan x="900" dy="34">channels</tspan></text>
    <text x="540" y="316"><tspan x="540">Apply average</tspan><tspan x="540" dy="34">reference</tspan></text>
    <text x="180" y="316"><tspan x="180">Extract conditions as</tspan><tspan x="180" dy="34">separate epochs</tspan></text>

    <text x="180" y="531"><tspan x="180">Transform data to</tspan><tspan x="180" dy="34">frequency domain</tspan><tspan x="180" dy="34">(FFT)</tspan></text>
    <text x="540" y="541"><tspan x="540">Calculate BCA, SNR,</tspan><tspan x="540" dy="34">and z scores</tspan></text>
    <text x="900" y="558">Output data to .xlsx</text>
    <text x="1260" y="541"><tspan x="1260">Data are ready for</tspan><tspan x="1260" dy="34">statistical analysis</tspan></text>
  </g>

</svg>
